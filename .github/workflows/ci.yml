name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The parser is developed on Windows (Oodle FFI, cp949 console); the Rust job
# runs there so the Oodle dependency always links. The Python checks are pure
# stdlib and run on Ubuntu.
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo +1.86.0 fmt --check
      - name: clippy
        run: cargo +1.86.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo +1.86.0 test --workspace --locked
      - name: all features and targets
        run: cargo +1.86.0 check --workspace --all-targets --all-features --locked
      - name: advertised core and singleton feature matrix
        shell: pwsh
        run: |
          $matrix = @(
            @("vrfkit", ""), @("vrfkit", "export"),
            @("vrf-bitio", ""), @("vrf-bitio", "alloc"),
            @("vrf-container", ""), @("vrf-container", "oodle"),
            @("vrf-container", "event"), @("vrf-container", "checkpoint"),
            @("vrf-decode", ""), @("vrf-decode", "array"),
            @("vrf-decode", "effect"), @("vrf-decode", "overlay"),
            @("vrf-decode", "structs"),
            @("vrf-export", ""), @("vrf-export", "parquet"),
            @("vrf-export", "fields"), @("vrf-export", "movement"),
            @("vrf-export", "actors"), @("vrf-export", "net-guids"),
            @("vrf-export", "events"), @("vrf-export", "snappy"),
            @("vrf-net", ""), @("vrf-net", "diagnostics"),
            @("vrf-schema", ""), @("vrf-schema", "checkpoint")
          )
          foreach ($case in $matrix) {
            $cargoArgs = @(
              "+1.86.0", "check", "-p", $case[0],
              "--no-default-features", "--locked"
            )
            if ($case[1]) { $cargoArgs += @("--features", $case[1]) }
            Write-Host "cargo $($cargoArgs -join ' ')"
            & cargo @cargoArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: standalone probe tool
        run: cargo +1.86.0 check --manifest-path tools/probe_offset/Cargo.toml --locked
      - name: strict rustdoc
        run: cargo +1.86.0 doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python interop dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Rust Parquet to PyArrow interoperability
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vrfkit-python-interop'
          $env:VRFKIT_INTEROP_DIR = $root
          cargo +1.86.0 test -p vrf-export --test roundtrip write_interop_files --locked -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $interopDir = Join-Path $root 'interop'
          python -W error crates/vrf-export/tests/python_interop.py $interopDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Without this, eleven test modules fail to import and the suite runs 288
      # of its 376 tests while still reporting a number -- which is how this job
      # stayed red for months without anyone reading past the exit code.
      - name: python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: ASCII guard
        run: python -W error tools/check_ascii.py --check
      - name: overlay corrections
        run: python -W error tools/apply_type_corrections.py --check
      - name: generated checksum guard
        run: python -W error tools/extract_checksum_types.py --export tools/fixtures/checksum_export --check
      - name: baseline schemas
        run: python -W error tools/check_baseline_schemas.py --allow-missing-hashes
      - name: docs self-check
        run: python -W error tools/check_docs.py --fast
      # CONTRIBUTING calls these two required before a PR and CI did not run
      # either, so a PR could break them and still go green. Both are pure
      # Python over committed fixtures -- no corpus, no game install, no Oodle
      # -- which is why they belong in this job and the corpus guards do not.
      - name: tools test suite
        run: python -W error -m unittest discover -s tools/tests -p "test_*.py"
      - name: effect decoder
        run: python -W error tools/check_effect_decoder.py --check
