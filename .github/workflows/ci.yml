name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The parser is developed on Windows (Oodle FFI, cp949 console); the Rust job
# runs there so the Oodle dependency always links. The Python checks are pure
# stdlib and run on Ubuntu.
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build with export
        run: cargo build -p vrfkit --features export
      # The export-less build is a supported configuration but nothing else
      # compiles it, so code that only the export path uses went dead there
      # unnoticed. `-D warnings` makes the next one fail here instead.
      - name: build without export
        run: cargo build -p vrfkit --no-default-features
        env:
          RUSTFLAGS: -D warnings

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # tools/tests/test_viewer_data.py runs one guard (fmtStat) through real
      # Node, not just a source-level pin -- see that test's docstring. With
      # no Node on this runner a condition-inversion mutation there passes
      # the string-level pin unnoticed; this step is what makes the stronger
      # check actually execute in CI instead of silently skipping.
      - uses: actions/setup-node@v4
      - name: ASCII guard
        run: python tools/check_ascii.py --check
      - name: overlay corrections
        run: python tools/apply_type_corrections.py --check
      - name: docs self-check
        run: python tools/check_docs.py --fast
      # CONTRIBUTING calls these two required before a PR and CI did not run
      # either, so a PR could break them and still go green. Both are pure
      # Python over committed fixtures -- no corpus, no game install, no Oodle
      # -- which is why they belong in this job and the corpus guards do not.
      - name: tools test suite
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: effect decoder
        run: python tools/check_effect_decoder.py --check
