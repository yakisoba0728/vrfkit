name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'

# The parser is developed on Windows (Oodle FFI, cp949 console); the Rust job
# runs there so the Oodle dependency always links. Python checks run on Windows
# and Ubuntu with the dependencies from requirements.txt.
jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.86.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rustfmt
        run: cargo +1.86.0 fmt --check
      - name: clippy
        run: cargo +1.86.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: all features and targets
        run: cargo +1.86.0 check --workspace --all-targets --all-features --locked
      - name: advertised core and singleton feature matrix
        shell: pwsh
        run: |
          $matrix = @(
            @("vrfkit", ""), @("vrfkit", "export"),
            @("vrf-bitio", ""), @("vrf-bitio", "alloc"),
            @("vrf-container", ""), @("vrf-container", "oodle"),
            @("vrf-container", "event"), @("vrf-container", "checkpoint"),
            @("vrf-decode", ""), @("vrf-decode", "array"),
            @("vrf-decode", "effect"), @("vrf-decode", "overlay"),
            @("vrf-decode", "structs"),
            @("vrf-export", ""), @("vrf-export", "parquet"),
            @("vrf-export", "fields"), @("vrf-export", "movement"),
            @("vrf-export", "actors"), @("vrf-export", "net-guids"),
            @("vrf-export", "events"), @("vrf-export", "partials"),
            @("vrf-export", "checkpoint-context"),
            @("vrf-export", "snappy"),
            @("vrf-net", ""), @("vrf-net", "diagnostics"),
            @("vrf-schema", ""), @("vrf-schema", "checkpoint")
          )
          foreach ($case in $matrix) {
            $cargoArgs = @(
              "+1.86.0", "check", "-p", $case[0],
              "--no-default-features", "--locked"
            )
            if ($case[1]) { $cargoArgs += @("--features", $case[1]) }
            Write-Host "cargo $($cargoArgs -join ' ')"
            & cargo @cargoArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: standalone probe tool
        run: cargo +1.86.0 check --manifest-path tools/probe_offset/Cargo.toml --locked
      - name: strict rustdoc
        run: cargo +1.86.0 doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Python interop dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: workspace tests and measured documentation
        run: python -W error tools/check_docs.py
      - name: core-only runtime tests
        run: cargo +1.86.0 test -p vrfkit --no-default-features --locked
      - name: Rust Parquet to PyArrow interoperability
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vrfkit-python-interop'
          $env:VRFKIT_INTEROP_DIR = $root
          cargo +1.86.0 test -p vrf-export --test roundtrip write_interop_files --locked -- --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $interopDir = Join-Path $root 'interop'
          python -W error crates/vrf-export/tests/python_interop.py $interopDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Public fixtures are pinned by upstream commit and SHA-256. Builds
      # without public fixtures remain covered by the private local audit.
      - name: corpus baselines on the public upstream fixtures
        shell: pwsh
        env:
          UPSTREAM_REPLAYS: https://raw.githubusercontent.com/michel-giehl/ValorantReplayParser/b51d67423b7b4952d59051cf91e55efa1c42da05/tests/Test.Integration/Replays
        run: |
          cargo +1.86.0 build -p vrfkit --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path (Get-Location) 'target/debug/vrfkit.exe'
          $fixtures = @(
            @("1210", "9f8b32c5-c243-41ec-bbbb-832582edf652.12_10.vrf", "a4ce1b72f9bdf99492162013c1c909e6994a0d22bef1899e687fde71fbc86606"),
            @("1211", "5c673443-5bdc-4576-b416-aab3f62471a5.12_11.vrf", "7a7a5492ddf286bb04413da96f0d3b216f91150e8174a3a4397493529e17ebdd"),
            @("1300", "12974d2b-848f-490d-80ba-5f03a033c2d5.13_00.vrf", "fd49091dd43171bb060eb6bbae50ed6677aa1077344572c5bf65f0c6fe2b4c1a")
          )
          foreach ($fixture in $fixtures) {
            $build, $name, $sha256 = $fixture
            $corpus = Join-Path $env:RUNNER_TEMP "baseline-corpora/build_$build"
            New-Item -ItemType Directory -Force $corpus | Out-Null
            $replay = Join-Path $corpus $name
            Invoke-WebRequest -UseBasicParsing -Uri "$env:UPSTREAM_REPLAYS/$name" -OutFile $replay
            $actual = (Get-FileHash -Algorithm SHA256 $replay).Hash.ToLowerInvariant()
            if ($actual -ne $sha256) {
              Write-Error "fixture $name has SHA-256 $actual, expected $sha256"
              exit 1
            }
            python -W error tools/check_corpus_baseline.py --baseline "tools/baselines/build_$build.json" --corpus $corpus --exe $exe --require-input
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Run the same strict main/checkpoint gate used by the local full
          # corpus audit. Export success alone cannot hide array/leaf errors.
          python -W error tools/verify_build_corpus.py --exe $exe --corpus (Join-Path $env:RUNNER_TEMP 'baseline-corpora') --work-dir (Join-Path $env:RUNNER_TEMP 'public-fixture-audit') --output (Join-Path $env:RUNNER_TEMP 'public-fixture-report.json') --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # An independent decoder checks observed wire values. Require every
          # fixture identity across the three exports as well as exact matches.
          python -W error tools/validate_type_evidence.py (Join-Path $env:RUNNER_TEMP 'public-fixture-audit') tools/fixtures/public_fixture_type_evidence.json --compare-typed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: retain public replay verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-replay-verification
          path: |
            ${{ runner.temp }}/public-fixture-report.json
            ${{ runner.temp }}/public-fixture-audit/*/result.json
            ${{ runner.temp }}/public-fixture-audit/*/type-evidence.json
            ${{ runner.temp }}/public-fixture-audit/*/*.log
            ${{ runner.temp }}/public-fixture-audit/*/error.txt
          retention-days: 14
          if-no-files-found: warn
      # table.rs used to be generated from C# sources that existed on one
      # machine, so nothing else could regenerate it or say it still matched
      # its input. The input is vendored now; regenerating it here fails the
      # build on a hand edit, a descriptor change committed without its table,
      # or a generator change that moves the output. Last in the job because it
      # rewrites table.rs, which would make any later cargo step recompile.
      - name: descriptor table regenerates from the vendored source
        shell: pwsh
        run: |
          python -W error tools/extract_descriptors.py third_party/vrp/Replay.Valorant crates/vrf-decode/src/table.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -W error tools/apply_type_corrections.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.86.0 fmt -p vrf-decode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- crates/vrf-decode/src/table.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  python-checks:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # Install Arrow and NumPy before discovery so dependency-bearing test
      # modules are exercised along with the standard-library-only modules.
      - name: python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: ASCII guard
        run: python -W error tools/check_ascii.py --check
      - name: overlay corrections
        run: python -W error tools/apply_type_corrections.py --check
      - name: generated checksum guard
        run: python -W error tools/extract_checksum_types.py --export tools/fixtures/checksum_export --check
      - name: generated scoped type guard
        run: python -W error tools/generate_scoped_types.py --check
      - name: generated equippable table guard
        run: python -W error tools/extract_equippables.py --check
      - name: baseline schemas
        run: python -W error tools/check_baseline_schemas.py
      - name: docs self-check
        run: python -W error tools/check_docs.py --fast
      # These checks use committed fixtures and do not require Oodle.
      - name: tools test suite
        run: python -W error -m unittest discover -s tools/tests -p "test_*.py"
      - name: effect decoder
        run: python -W error tools/check_effect_decoder.py --check

  rust-stable:
    name: Rust stable / all features
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: all-feature runtime tests
        run: cargo +stable test --workspace --all-features --locked
      - name: core-only runtime tests
        run: cargo +stable test -p vrfkit --no-default-features --locked

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: validate workflow syntax, expressions and shell scripts
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  ci-complete:
    name: CI complete
    needs: [rust, rust-stable, python-checks, workflow-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require every test job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failures = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          print(failures or 'All required CI jobs passed')
          sys.exit(bool(failures) or not results)
          PY
