name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The parser is developed on Windows (Oodle FFI, cp949 console); the Rust job
# runs there so the Oodle dependency always links. The Python checks are pure
# stdlib and run on Ubuntu.
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build with export
        run: cargo build -p vrfkit --features export

  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ASCII guard
        run: python tools/check_ascii.py --check
      - name: overlay corrections
        run: python tools/apply_type_corrections.py --check
      - name: docs self-check
        run: python tools/check_docs.py --fast
