name: Phase C recovery diagnostics

on:
  push:
    branches: [phase-c/gameplay-recovery-validation]

permissions:
  contents: read

concurrency:
  group: phase-c-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.86.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: preserve attributable formatting candidate without committing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-c-recovery"
          git rev-parse HEAD > "$RUNNER_TEMP/phase-c-recovery/source-commit.txt"
          cargo +1.86.0 fmt --all
          git diff --binary > "$RUNNER_TEMP/phase-c-recovery/rustfmt.patch"
          git diff --check
          tar -cf "$RUNNER_TEMP/phase-c-recovery/formatted-source.tar" \
            crates/vrfkit/src/gameplay.rs \
            crates/vrfkit/src/gameplay/identity.rs \
            crates/vrfkit/src/gameplay/identity_tests.rs \
            crates/vrfkit/examples/gameplay_identity.rs
          sha256sum "$RUNNER_TEMP/phase-c-recovery/formatted-source.tar" \
            > "$RUNNER_TEMP/phase-c-recovery/formatted-source.sha256"
      - name: execute clean gameplay identity regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.86.0 test -p vrfkit --no-default-features --locked \
            gameplay::identity::tests:: -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/phase-c-recovery/identity-tests.log"
      - name: require two compiled source mutants to fail their targeted assertions
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          source = pathlib.Path('crates/vrfkit/src/gameplay/identity.rs')
          clean = source.read_text(encoding='utf-8')
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'phase-c-recovery'
          mutants = [
              ('raw_suffix', r'\s*\|\|\s*reader\.position\(\)\s*!=\s*u64::from\(field\.bit_count\)',
               'packed_guid_negative_controls_require_exact_value_width_and_termination'),
              ('active_reopen', r'\s*\|\|\s*life\s*\.conflicting_open\s*\.as_ref\(\)\s*\.is_some_and\(\|event\| event\.packet_id < packet\)',
               'repeated_open_without_dormancy_is_unresolved_on_same_or_other_channel'),
          ]
          receipts = []
          try:
              for name, pattern, test in mutants:
                  mutated, count = re.subn(pattern, '', clean)
                  if count != 1:
                      raise RuntimeError(f'{name}: expected one mutation site, found {count}')
                  source.write_text(mutated, encoding='utf-8')
                  exact = 'gameplay::identity::tests::' + test
                  result = subprocess.run(
                      ['cargo', '+1.86.0', 'test', '-p', 'vrfkit', '--no-default-features',
                       '--locked', '--lib', exact, '--', '--exact', '--nocapture'],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                      encoding='utf-8', errors='replace', check=False)
                  (destination / (name + '.log')).write_text(result.stdout, encoding='utf-8')
                  killed = (result.returncode == 101
                            and 'running 1 test' in result.stdout
                            and exact + ' ... FAILED' in result.stdout
                            and 'test result: FAILED.' in result.stdout)
                  receipts.append({'mutant': name, 'test': exact,
                                   'exit_code': result.returncode, 'assertion_failure_observed': killed})
                  if not killed:
                      raise RuntimeError(f'{name}: no compiled assertion failure observed')
          finally:
              source.write_text(clean, encoding='utf-8')
              (destination / 'mutation-receipt.json').write_text(
                  json.dumps({'mutants': receipts, 'source_restored': source.read_text(encoding='utf-8') == clean}, indent=2) + '\n',
                  encoding='utf-8')
          PY
      - name: verify clean restoration
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.86.0 fmt --check
          cargo +1.86.0 test -p vrfkit --no-default-features --locked \
            gameplay::identity::tests:: -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/phase-c-recovery/restored-tests.log"
      - name: retain public source patches and synthetic-only receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-c-recovery-diagnostics
          path: ${{ runner.temp }}/phase-c-recovery/
          if-no-files-found: error
          retention-days: 3
