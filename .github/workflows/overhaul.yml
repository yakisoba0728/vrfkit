name: Overhaul validation

on:
  pull_request:
    branches: [integration/vrfkit-overhaul]
  push:
    branches: [integration/vrfkit-overhaul]

permissions:
  contents: read

concurrency:
  group: overhaul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  existing-ci:
    name: Reusable CI
    uses: ./.github/workflows/ci.yml

  complete:
    name: Overhaul complete
    if: ${{ always() }}
    needs: [existing-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: require every validation job
        env:
          EXISTING_CI: ${{ needs.existing-ci.result }}
        run: |
          test "$EXISTING_CI" = success
