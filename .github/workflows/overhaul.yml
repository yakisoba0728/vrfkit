name: Overhaul validation

on:
  pull_request:
    branches: [integration/vrfkit-overhaul]
  push:
    branches: [integration/vrfkit-overhaul]

permissions:
  contents: read

concurrency:
  group: overhaul-${{ github.ref }}
  cancel-in-progress: true

jobs:
  existing-ci:
    name: Existing validation (unchanged)
    uses: ./.github/workflows/ci.yml

  linux-rust:
    name: Rust 1.86 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.86.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: overhaul-linux-msrv
      - name: all-feature runtime tests
        run: cargo +1.86.0 test --workspace --all-features --locked
      - name: core-only runtime tests
        run: cargo +1.86.0 test -p vrfkit --no-default-features --locked

  complete:
    name: Overhaul complete
    if: ${{ always() }}
    needs: [existing-ci, linux-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: require every validation job
        env:
          EXISTING_CI: ${{ needs.existing-ci.result }}
          LINUX_RUST: ${{ needs.linux-rust.result }}
        run: |
          test "$EXISTING_CI" = success
          test "$LINUX_RUST" = success
