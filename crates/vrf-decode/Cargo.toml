[package]
name = "vrf-decode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Type-aware field decoders for Unreal Engine replay primitives"

[dependencies]
vrf-bitio = { workspace = true }
thiserror = { workspace = true }

# `decode_field` and the model types are the crate's core and have no flag:
# every decoder below is expressed in terms of them, so there is nothing to
# take away. The four that ARE separable each stand alone -- none of them
# depends on another -- and all are on by default, so a consumer that asks for
# nothing gets what it got before these existed. `overlay` is the one worth
# dropping if the primitive decoders are all you want: it is what pulls in the
# 1,232-entry generated table.
[features]
default = ["array", "effect", "overlay", "structs"]
array = []
effect = []
overlay = []
structs = []
